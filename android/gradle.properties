org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=bcprov-jdk15on
# Allow plugins (e.g. receive_sharing_intent 1.8.0) that compile Java at 1.8 but
# let Kotlin default to 17 to build. Newer Kotlin Gradle Plugin treats the JVM-target
# mismatch as an error; downgrade to a warning so the Android APK build proceeds.
kotlin.jvm.target.validation.mode=warning