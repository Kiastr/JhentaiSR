allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Pin AndroidX artifacts below the AGP 8.9.1 requirement so the build stays
// compatible with the project's AGP 8.3.1 / Gradle 8.4 toolchain.
// Flutter 3.38.10 caps Gradle at 8.8 (Kotlin 2.0.20 -> [6.8.3, 8.9)), so AGP
// cannot be raised to 8.9.1 (which needs Gradle >= 8.9). Recent AndroidX releases
// (browser 1.9.0, core 1.17.0) declare minAgp 8.9.1 and fail :app:checkReleaseAarMetadata,
// so we force the last pre-8.9.1-compatible versions.
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.browser:browser:1.8.0'
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
}

rootProject.buildDir = '../build'

// https://github.com/flutter/flutter/issues/153668
subprojects {
    afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            Integer pluginCompileSdk = project.android.compileSdk
            if (pluginCompileSdk != null && pluginCompileSdk < 31) {
                project.logger.error(
                        "Warning: Overriding compileSdk version in Flutter plugin: "
                                + project.name
                                + " from "
                                + pluginCompileSdk
                                + " to 31 (to work around https://issuetracker.google.com/issues/199180389)."
                                + "\nIf there is not a new version of " + project.name + ", consider filing an issue against "
                                + project.name
                                + " to increase their compileSdk to the latest (otherwise try updating to the latest version)."
                )
                project.android {
                    compileSdk 31
                }
            }
        }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
