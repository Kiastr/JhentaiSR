name: JHenTai Build

on:
  push:
    branches: [ "master", "main", "trae/solo-agent-8mOOQg" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Clean and Get dependencies
        run: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get

      - name: Build Runner
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            # 增加 --delete-conflicting-outputs 强制覆盖，并尝试直接运行 dart run
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Build APK
        run: flutter build apk --release -t lib/src/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jhentai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows
    runs-on: windows-2019

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Clean and Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Runner
        run: |
          if (Select-String -Path pubspec.yaml -Pattern "build_runner" -Quiet) {
            dart run build_runner build --delete-conflicting-outputs
          }

      - name: Build Windows
        run: flutter build windows --release -t lib/src/main.dart

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: jhentai-release-windows
          path: build/windows/x64/runner/Release
